server:
  port: ${SERVER_PORT}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  application:
    name: ${APP_NAME}

  datasource:
    url: jdbc:sqlserver://${DATABASE_HOST}:${DATABASE_PORT};database=${DATABASE_NAME};encrypt=${DATABASE_ENCRYPT}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAXPOOL:20}
      minimum-idle: ${DATABASE_MINPOOL:10}
      connection-timeout: ${DATABASE_TIMEOUT:30000}
      max-lifetime: ${DATABASE_MAXLIFETIME:1800000}
      idle-timeout: ${DATABASE_IDLETIMEOUT:600000}
      connection-test-query: SELECT 1
      leak-detection-threshold: ${DATABASE_LEAKDETECTION:60000}
      pool-name: ${APP_NAME}-pool

  flyway:
    enabled: true
    locations: classpath:migration
    baseline-on-migrate: true
    validate-on-migrate: true

jwt:
  expiration: ${JKT_EXPIRATION}
  issuer: ${JWT_ISSUER}
  secret: ${JWT_SECRET}

customer-dbs:
  host: ${CUSTOMER_DB_HOST}
  port: ${CUSTOMER_DB_PORT:1433}
  username: ${CUSTOMER_DB_USER}
  password: ${CUSTOMER_DB_PASSWORD}
  encrypt: ${CUSTOMER_DB_ENCRYPT:false}
  db1-name: ${CUSTOMER_DB1_NAME:BangGiaVang}
  db2-name: ${CUSTOMER_DB2_NAME:SADVietNam}
  db3-name: ${CUSTOMER_DB3_NAME:}

